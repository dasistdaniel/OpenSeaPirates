# Produktion: ein Container, ein Port. TLS/Reverse Proxy macht der Betreiber selbst
# (WebSocket-Upgrade auf /ws durchreichen!). Konfiguration über .env (siehe .env.example).
services:
  osp:
    build: .
    image: osp:latest
    container_name: osp
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-4100}:4000"
    volumes:
      # Spielstände (profiles.json): bleiben bei Neustart und Deploy erhalten
      - osp-data:/data
    environment:
      OSP_SEED: ${OSP_SEED:-}
      OSP_BOTS: ${OSP_BOTS:-0}
      OSP_ORIGINS: ${OSP_ORIGINS:-}

volumes:
  osp-data:
